data_ingestion:
  test_size: 0.20
  random_state: 42

data_preprocessing:
  max_features_tfidf: 5000
  sentiment_threshold_positive: 0.05
  sentiment_threshold_negative: -0.05
  ngram_range: [1, 2]
  min_df: 2
  max_df: 0.95

feature_engineering:
  top_categories_threshold: 3000
  delivery_time_outlier_threshold: 30

model_training:
  models:
    - "LogisticRegression"
    - "RandomForestClassifier"
    - "GradientBoostingClassifier"
    - "SVC"
    - "AdaBoostClassifier"
    - "KNeighborsClassifier"
    - "GaussianNB"
    - "DecisionTreeClassifier"
  random_state: 42
  max_iter: 1000
  n_estimators: 100
  n_neighbors: 5
  test_size: 0.2

model_evaluation:
  metrics:
    - "accuracy"
    - "precision"
    - "recall"
    - "f1"
    - "roc_auc"
  average_method: "weighted"

mlflow:
  experiment_name: "customer_satisfaction_analysis"
  tracking_uri: "http://localhost:5000"
  model_name: "customer_satisfaction_model"

deployment:
  host: "0.0.0.0"
  port: 8501